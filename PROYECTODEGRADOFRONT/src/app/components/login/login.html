<div class="login-container">

  <!-- Login principal -->
  <mat-card class="login-card">
    <img src="images/station-logo.svg" alt="Logo Estación Meteorológica" class="login-logo" />

    <h1 class="login-title">Iniciar Sesión</h1>
    <p class="login-subtitle">APLICACIÓN LOCAL LESTOMA</p>

    <mat-form-field appearance="outline" class="login-input">
      <mat-label>Usuario</mat-label>
      <input matInput [(ngModel)]="user" placeholder="Ingrese su usuario" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="login-input">
      <mat-label>Contraseña</mat-label>
      <input
        matInput
        [(ngModel)]="password"
        placeholder="Ingrese su contraseña"
        type="password"
        (keyup.enter)="login()"
      />
    </mat-form-field>

    <a routerLink="/forget-password" class="forgot-password-link"> Reestablecer contraseña!</a>

    <div class="button-section">
      <button mat-raised-button class="custom-button" type="button" (click)="login()" (keyup.enter)="login()">
        Ingresar
      </button>
    </div>
  </mat-card>
</div>
